# Production Profile Configuration
# All sensitive configuration strictly supplied via environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate Schema Validation in Production (No automatic schema mutation)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT Configuration (Required in Production)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging in Production
logging.level.root=INFO
logging.level.com.sagarika.hospital=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# CORS Configuration in Production (Strictly requires explicit frontend domain, e.g. https://hospital.example.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
